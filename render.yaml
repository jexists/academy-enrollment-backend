# Render 블루프린트 — main에 push하면 자동으로 다시 배포된다.
# 비밀값(sync: false)은 Render 대시보드에서 직접 입력한다. 이 파일에는 값을 적지 않는다.
services:
  - type: web
    name: academy-enrollment-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      # 요청을 받을 프런트 주소 (Vercel 웹·어드민)
      - key: FRONTEND_ORIGIN
        value: https://academy-enrollment-web.vercel.app,https://academy-enrollment-admin.vercel.app
      # Render PostgreSQL External Database URL — 대시보드에서 입력
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@naver.com
      # 원장 계정이 없을 때만 쓰인다 (이미 있으면 그대로) — 대시보드에서 입력
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      # DEMO_LOGIN은 넣지 않는다 (배포 서버에서는 데모 로그인 버튼이 꺼져 있어야 함)
